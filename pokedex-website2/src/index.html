<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div id="pokemon-modal">
        <div class="modal-content">
            <button class="close-btn" aria-label="Close">&times;</button>
            <div id="modal-body"></div>
        </div>
    </div>
    
    <header>
        <h1>Pokedex</h1>
    </header>
    <main>
        <div style="margin: 20px 0; text-align:center;">
            <input id="pokemon-search" type="text" placeholder="Search Pokémon by name..." style="width: 260px; padding: 8px; font-size: 1em; border-radius: 8px; border: 1px solid #bbb;">
            <span id="type-filters" style="margin-left:24px;display:inline-block;vertical-align:middle;">
                <!-- Type filter button and dropdown will be rendered here -->
            </span>
        </div>
        <section id="pokemon-list">
            <!-- Pokémon data will be dynamically inserted here -->
        </section>
    </main>
    <footer>
        <p>&copy; 2023 Pokedex Website</p>
    </footer>

    <!-- Load scripts as modules -->
    <script src="scripts/filters.js" type="module"></script>
    <script src="scripts/app.js" type="module"></script>
</body>
</html>
